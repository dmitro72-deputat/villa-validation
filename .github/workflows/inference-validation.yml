
name: Villa Inference Validation

on:
  workflow_dispatch:
  push:
    branches:
      - validation/inference-audit
    paths:
      - '.github/workflows/inference-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install scikit-build-core cmake ninja pybind11

      - name: Build VC Reader
        run: python -m pip install ./vc_reader

      - name: Install test dependencies
        run: |
          python -m pip install "./vesuvius[tests]"
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install zarr scipy opencv-python-headless einops tqdm

      - name: Run inference tests
        working-directory: vesuvius
        run: |
          python -m pytest -v \
            tests/ink_detection/test_flat_inference.py \
            tests/ink_detection/test_native_full3d_inference.py \
            tests/ink_detection/test_roi_inference.py
