name: Villa independent validation - Linux
on:
  push:
    branches: [audit/final-independent-validation]
    paths:
      - '.github/workflows/final-validation-linux.yml'
      - '.github/validation/final_independent_validation.py'
  workflow_dispatch:
permissions:
  contents: read
env:
  AGENTS_AGENT_MODE: '1'
  AGENTS_ALLOW_INSTALL: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  WANDB_MODE: offline
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install scikit-build-core cmake ninja pybind11

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nlohmann-json3-dev \
            libboost-dev \
            libconcurrentqueue-dev \
            libcurl4-openssl-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libblosc-dev \
            libzstd-dev \
            liblz4-dev \
            libtiff-dev \
            libpng-dev \
            libjpeg-dev \
            pkg-config strace

      - name: Build and install Blosc2
        run: |
          git clone --depth 1 --branch v2.15.2 \
            https://github.com/Blosc/c-blosc2.git /tmp/c-blosc2
          cmake -S /tmp/c-blosc2 -B /tmp/c-blosc2/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_EXAMPLES=OFF
          cmake --build /tmp/c-blosc2/build --parallel 2
          sudo cmake --install /tmp/c-blosc2/build
          sudo ldconfig
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH}"
          pkg-config --modversion blosc2
          pkg-config --atleast-version=2.13 blosc2
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Build VC Reader
        env:
          CMAKE_ARGS: "-DVC_READER_ENABLE_CUDA=OFF"
        run: python -m pip install ./vc_reader pytest

      - name: Install test dependencies
        run: |
          python -m pip install "./vesuvius[tests]"
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install zarr scipy opencv-python-headless einops tqdm numba imagecodecs timm huggingface-hub fsspec aiohttp accelerate wandb pytorch-optimizer matplotlib scikit-image scikit-learn psutil click Pillow


      - name: Compare dense CT pyramids and full small native inference
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          source=vesuvius/src/vesuvius/ink_detection/inference/infer_full3d_tifxyz.py
          script=.github/validation/final_independent_validation.py
          export PYTHONPATH="$PWD/vesuvius/src"
          cp "$source" "$work/combined.py"
          trap 'cp "$work/combined.py" "$source"' EXIT
          git show "659e2fadb836d44063ed831d85517154ec852f11:$source" > "$work/upstream.py"
          git show "3b31fd9:$source" > "$work/occupancy.py"
          git fetch --depth=1 origin refs/heads/perf/sparse-native-ink-pyramid
          test "$(git rev-parse FETCH_HEAD)" = 83c219b86c8f408da7db3033364e04fa6a445331
          git show "83c219b86c8f408da7db3033364e04fa6a445331:$source" > "$work/pyramid.py"

          python "$script" dense-prepare "$work/template"
          for trial in 1 2 3; do
            order=(upstream combined)
            if [[ "$trial" == 2 ]]; then order=(combined upstream); fi
            for variant in "${order[@]}"; do
              cp "$work/$variant.py" "$source"
              cp -r "$work/template" "$work/$variant"
              printf 'dense %s trial %s ' "$variant" "$trial"
              python "$script" dense-run "$work/$variant"
            done
            diff -qr "$work/upstream" "$work/combined"
            rm -r "$work/upstream" "$work/combined"
          done

          cp "$work/combined.py" "$source"
          python "$script" prepare-ct "$work/fixture"
          for variant in upstream occupancy pyramid combined; do
            cp "$work/$variant.py" "$source"
            mkdir -p "$work/$variant"
            echo "Full CPU inference: $variant"
            /usr/bin/time -f "$variant wall=%e s peak=%M KiB" \
              python -m vesuvius.ink_detection.inference.infer_full3d_tifxyz \
                "$work/fixture/mesh" "$work/fixture/fixture.pth" "$work/$variant/prediction.zarr" \
                --device cpu --resolution 0 --overlap 0 --chunk-halo 0 --write-region occupied \
                --no-compile --batch-size 2 --num-workers 0 --downsample-workers 2
            python "$script" inspect "$work/$variant/prediction.zarr" > "$work/$variant.txt"
            diff -qr "$work/upstream/prediction.zarr" "$work/$variant/prediction.zarr"
            cmp "$work/upstream.txt" "$work/$variant.txt"
            sha256sum "$work/$variant.txt"
          done
          cat "$work/combined.txt"

      - name: Run offline ink and Zarr regression suites together
        run: |
          python -m pytest -q -m 'not slow and not network' vesuvius/tests/ink_detection
          python -m pytest -q vc_reader/tests/test_zarr_writer.py
